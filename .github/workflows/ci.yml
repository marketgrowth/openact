name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:search
      - run: npm run build
      - name: Check that the Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist/worker
      - name: Check that apps can be added
        run: |
          npm run openact -- add hello
          npm run openact -- add orbytt
          npm install
          npm run typecheck
          npm run build
          npx wrangler deploy --dry-run --outdir dist/worker-with-hello
